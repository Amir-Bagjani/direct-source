name: Backend checks
on:
  push:
    paths: ["apps/backend/**", "docs/technical/api/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["apps/backend/**", "docs/technical/api/**", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://marketplace:marketplace@127.0.0.1:55432/marketplace
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (redacted)
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 dir /repo --redact --no-banner
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv sync --locked --python 3.13.14
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy marketplace config
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py migrate --noinput
      - run: uv run python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yaml
      - run: uv run pytest --cov --cov-report=term-missing
      - run: uv run pip-audit --progress-spinner off
