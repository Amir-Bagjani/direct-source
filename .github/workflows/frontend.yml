name: Frontend checks
on:
  pull_request:
    paths: ["apps/frontend/**", "apps/backend/**", "docs/technical/api/openapi.yaml", ".github/workflows/frontend.yml"]
  push:
    paths: ["apps/frontend/**", "apps/backend/**", "docs/technical/api/openapi.yaml", ".github/workflows/frontend.yml"]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    services:
      clamav:
        image: clamav/clamav:1.4
        ports: ["3310:3310"]
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 10s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv sync --locked --python 3.13.14
        working-directory: apps/backend
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:api
      - run: git diff --exit-code -- src/shared/api/openapi.ts
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test:hooks
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
        env:
          PLAYWRIGHT_SERVER_MODE: production
      - run: pnpm test:e2e:registration
        env:
          PLAYWRIGHT_SERVER_MODE: production
      - run: pnpm test:e2e:accounts
        env:
          PLAYWRIGHT_SERVER_MODE: production
      - run: pnpm test:e2e:accounts
        env:
          PLAYWRIGHT_SERVER_MODE: production
          ACCOUNTS_MOBILE: "true"
      - run: pnpm test:e2e:accounts
        env:
          PLAYWRIGHT_SERVER_MODE: production
          ACCOUNTS_BROWSER: webkit
      - run: pnpm test:e2e:recovery
        env:
          PLAYWRIGHT_SERVER_MODE: production
      - run: pnpm test:e2e:recovery
        env:
          PLAYWRIGHT_SERVER_MODE: production
          RECOVERY_LOCALE: en
          ACCOUNTS_MOBILE: "true"
      - run: pnpm test:e2e:business
        env:
          PLAYWRIGHT_SERVER_MODE: production
      - run: pnpm test:e2e:business
        env:
          PLAYWRIGHT_SERVER_MODE: production
          ACCOUNTS_MOBILE: "true"
      - run: pnpm test:e2e:onboarding
        env:
          PLAYWRIGHT_SERVER_MODE: production
      - run: pnpm test:e2e:onboarding
        env:
          PLAYWRIGHT_SERVER_MODE: production
          ONBOARDING_LOCALE: en
          ACCOUNTS_MOBILE: "true"
      - run: pnpm test:e2e:catalog
        env:
          PLAYWRIGHT_SERVER_MODE: production
  container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - name: Verify standalone pages, assets and safe SEO defaults
        run: |
          docker compose exec -T frontend node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {existsSync} from 'node:fs';
          assert.notEqual(process.getuid(), 0, 'Runtime must not run as root');
          assert.equal(existsSync('/app/.env.local'), false);
          assert.equal(existsSync('/app/.env'), false);
          const read = async (path) => {
            const response = await fetch(`http://127.0.0.1:3000${path}`, {
              redirect: 'error', signal: AbortSignal.timeout(10000)
            });
            assert.equal(response.status, 200, path);
            return response.text();
          };
          for (const [locale, direction] of [['fa', 'rtl'], ['en', 'ltr']]) {
            const html = await read(`/${locale}`);
            assert.match(html, new RegExp(`<html[^>]*lang="${locale}"`));
            assert.match(html, new RegExp(`<html[^>]*dir="${direction}"`));
            assert.match(html, /name="robots"[^>]*content="[^"]*noindex/);
            const assets = [...html.matchAll(/(?:src|href)="(\/_next\/static\/[^"?]+\.(?:js|css))(?:\?[^"]*)?"/g)];
            assert.ok(assets.length > 0, 'Standalone must serve static assets');
            await Promise.all(assets.map(([, path]) => read(path)));
          }
          assert.match(await read('/robots.txt'), /Disallow: \/\s/);
          assert.doesNotMatch(await read('/sitemap.xml'), /<loc>/);
          NODE
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
