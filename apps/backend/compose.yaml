name: directsourcing
services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.5-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["full"]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: local-marketplace
      MINIO_ROOT_PASSWORD: local-marketplace-password
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["object-data:/data"]
  clamav:
    image: clamav/clamav:1.4
    profiles: ["full"]
    ports: ["127.0.0.1:3310:3310"]
    volumes: ["clamav-data:/var/lib/clamav"]
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["full"]
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  web:
    build: .
    profiles: ["app"]
    env_file: .env
    environment: &app-environment
      DATABASE_URL: postgres://marketplace:marketplace@postgres:5432/marketplace
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      EMAIL_HOST: mailpit
      CLAMAV_HOST: clamav
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:9000
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: .
    profiles: ["app"]
    env_file: .env
    environment: *app-environment
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  beat:
    build: .
    profiles: ["app"]
    env_file: .env
    environment: *app-environment
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      redis: {condition: service_healthy}
volumes:
  postgres-data:
  object-data:
  clamav-data:
