[project]
name = "directsourcing-backend"
version = "0.1.0"
description = "DirectSourcing modular Django backend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.17.2,<3.18",
  "djangorestframework-simplejwt>=5.5,<6",
  "drf-spectacular>=0.28,<0.30",
  "psycopg[binary,pool]>=3.2,<4",
  "celery[redis]>=5.5,<6",
  "django-storages[s3]>=1.14,<2",
  "Pillow>=11,<13",
  "gunicorn>=23,<26",
  "django-environ>=0.12,<0.14",
]

[dependency-groups]
dev = [
  "pytest>=8,<10", "pytest-django>=4.11,<5", "pytest-cov>=6,<8",
  "ruff>=0.12,<1", "mypy>=1.16,<2", "django-stubs[compatible-mypy]>=5.2,<5.3",
  "djangorestframework-stubs>=3.16,<3.18", "pip-audit>=2.9,<3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = ["integration: requires real PostgreSQL", "contract: API/schema contract tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["migrations", "tests"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.coverage.run]
source = ["marketplace"]
omit = ["*/migrations/*", "*/apps.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
