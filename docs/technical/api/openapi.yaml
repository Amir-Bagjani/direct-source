components:
  schemas:
    ActivationInputRequest:
      type: object
      properties:
        enabled:
          type: boolean
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - enabled
      - reason
    ActivityRequest:
      type: object
      properties:
        evidence_type:
          $ref: '#/components/schemas/EvidenceTypeEnum'
        files:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
          minItems: 1
      required:
      - evidence_type
      - files
    ActualPackageInputRequest:
      type: object
      properties:
        count:
          type: integer
          maximum: 1000000
          minimum: 1
        weight_g:
          type: integer
          maximum: 1000000000
          minimum: 1
        length_mm:
          type: integer
          maximum: 1000000
          minimum: 1
        width_mm:
          type: integer
          maximum: 1000000
          minimum: 1
        height_mm:
          type: integer
          maximum: 1000000
          minimum: 1
      required:
      - count
      - height_mm
      - length_mm
      - weight_g
      - width_mm
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        province:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
      required:
      - address
      - city
      - id
      - province
    AddressInputRequest:
      type: object
      properties:
        province:
          type: string
          minLength: 1
          maxLength: 100
        city:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - address
      - city
      - province
    AgentInputRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        mobile:
          type: string
          maxLength: 30
        plate:
          type: string
          maxLength: 30
    AmountOutput:
      type: object
      properties:
        goods_irr:
          type: integer
        retailer_fee_irr:
          type: integer
        manufacturer_fee_irr:
          type: integer
        shipping_irr:
          type: integer
        total_irr:
          type: integer
        manufacturer_payable_irr:
          type: integer
        retained:
          type: object
          additionalProperties:
            type: integer
        shipping_groups:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - goods_irr
      - manufacturer_fee_irr
      - manufacturer_payable_irr
      - retailer_fee_irr
      - retained
      - shipping_groups
      - shipping_irr
      - total_irr
    Assignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        carrier_snapshot: {}
        pickup_start:
          type: string
          format: date-time
        pickup_end:
          type: string
          format: date-time
        actor:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 2000
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - carrier_snapshot
      - created_at
      - id
      - pickup_end
      - pickup_start
      - reason
    AssignmentInputRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        carrier_id:
          type: string
          format: uuid
        pickup_start:
          type: string
          format: date-time
        pickup_end:
          type: string
          format: date-time
        agent:
          $ref: '#/components/schemas/AgentInputRequest'
      required:
      - carrier_id
      - pickup_end
      - pickup_start
      - reason
    AttachmentInputRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
        consent_version:
          type: string
          minLength: 1
          maxLength: 40
        order_id:
          type: string
          format: uuid
        ticket_id:
          type: string
          format: uuid
      required:
      - consent_version
      - file
    Attribute:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        category:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        kind:
          $ref: '#/components/schemas/AttributeKindEnum'
        scope:
          $ref: '#/components/schemas/AttributeScopeEnum'
        unit:
          type: string
          maxLength: 40
        required:
          type: boolean
        filterable:
          type: boolean
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
        options:
          type: array
          items:
            $ref: '#/components/schemas/Option'
          readOnly: true
      required:
      - category
      - code
      - id
      - kind
      - name
      - options
      - scope
    AttributeKindEnum:
      enum:
      - choice
      - number
      - text
      type: string
      description: |-
        * `choice` - فهرست
        * `number` - عدد
        * `text` - متن
    AttributeRequest:
      type: object
      properties:
