components:
  schemas:
    ActivationInputRequest:
      type: object
      properties:
        enabled:
          type: boolean
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - enabled
      - reason
    ActivityRequest:
      type: object
      properties:
        evidence_type:
          $ref: '#/components/schemas/EvidenceTypeEnum'
        files:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
          minItems: 1
      required:
      - evidence_type
      - files
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        province:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
      required:
      - address
      - city
      - id
      - province
    AddressInputRequest:
      type: object
      properties:
        province:
          type: string
          minLength: 1
          maxLength: 100
        city:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - address
      - city
      - province
    Attribute:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        category:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        kind:
          $ref: '#/components/schemas/AttributeKindEnum'
        scope:
          $ref: '#/components/schemas/AttributeScopeEnum'
        unit:
          type: string
          maxLength: 40
        required:
          type: boolean
        filterable:
          type: boolean
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
        options:
          type: array
          items:
            $ref: '#/components/schemas/Option'
          readOnly: true
      required:
      - category
      - code
      - id
      - kind
      - name
      - options
      - scope
    AttributeKindEnum:
      enum:
      - choice
      - number
      - text
      type: string
      description: |-
        * `choice` - فهرست
        * `number` - عدد
        * `text` - متن
    AttributeRequest:
      type: object
      properties:
        category:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        kind:
          $ref: '#/components/schemas/AttributeKindEnum'
        scope:
          $ref: '#/components/schemas/AttributeScopeEnum'
        unit:
          type: string
          maxLength: 40
        required:
          type: boolean
        filterable:
          type: boolean
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
        reason:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 2000
      required:
      - category
      - code
      - kind
      - name
      - scope
    AttributeScopeEnum:
      enum:
      - product
      - variant
      type: string
      description: |-
        * `product` - محصول
        * `variant` - تنوع
    Business:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
