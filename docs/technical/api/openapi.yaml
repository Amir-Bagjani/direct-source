components:
  schemas:
    ActivityRequest:
      type: object
      properties:
        evidence_type:
          $ref: '#/components/schemas/EvidenceTypeEnum'
        files:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
          minItems: 1
      required:
      - evidence_type
      - files
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        province:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
      required:
      - address
      - city
      - id
      - province
    AddressInputRequest:
      type: object
      properties:
        province:
          type: string
          minLength: 1
          maxLength: 100
        city:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - address
      - city
      - province
    Attribute:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        category:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        kind:
          $ref: '#/components/schemas/AttributeKindEnum'
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        unit:
          type: string
          maxLength: 40
        required:
          type: boolean
        filterable:
          type: boolean
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
        options:
          type: array
          items:
            $ref: '#/components/schemas/Option'
          readOnly: true
      required:
      - category
      - code
      - id
      - kind
      - name
      - options
      - scope
    AttributeKindEnum:
      enum:
      - choice
      - number
      - text
      type: string
      description: |-
        * `choice` - فهرست
        * `number` - عدد
        * `text` - متن
    AttributeRequest:
      type: object
      properties:
        category:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        kind:
          $ref: '#/components/schemas/AttributeKindEnum'
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        unit:
          type: string
          maxLength: 40
        required:
          type: boolean
        filterable:
          type: boolean
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
      required:
      - category
      - code
      - kind
      - name
      - scope
    Business:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/BusinessKindEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BusinessStatusEnum'
          readOnly: true
        phone:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        controlled_access:
          type: boolean
          readOnly: true
        first_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
          readOnly: true
      required:
      - addresses
      - controlled_access
      - description
      - first_verified_at
      - id
      - kind
      - name
      - phone
      - status
    BusinessInputRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: '#/components/schemas/BusinessKindEnum'
        phone:
          type: string
          minLength: 1
          pattern: ^\+?[0-9]{7,15}$
        description:
          type: string
          minLength: 1
          maxLength: 2000
        address:
          $ref: '#/components/schemas/AddressInputRequest'
      required:
      - address
      - description
      - kind
      - name
      - phone
    BusinessKindEnum:
      enum:
      - manufacturer
      - retailer
      type: string
      description: |-
        * `manufacturer` - تولیدکننده
        * `retailer` - خرده‌فروش
    BusinessStatusEnum:
      enum:
      - draft
      - pending
      - changes_requested
      - verified
      - rejected
      - suspended
      type: string
      description: |-
        * `draft` - پیش‌نویس
        * `pending` - در انتظار تأیید
        * `changes_requested` - نیازمند اصلاح
        * `verified` - تأییدشده
        * `rejected` - ردشده
        * `suspended` - تعلیق‌شده
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        parent:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
          maxLength: 1000
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
      required:
      - id
      - name
      - slug
